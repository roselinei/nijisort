    // --- ここから下はソートのアルゴリズム（変更不要） ---
    let parent = [], parentNext = [], cmp1 = [], cmp2 = [], head1 = 0, head2 = 0, merged = [];
    let totalBattles = 0, currentBattle = 0;

    function initSort() {
      parent = members.map(m => [m]);
      parentNext = [];
      let n = members.length;
      totalBattles = Math.ceil(n * Math.log2(n)); 
      currentBattle = 0;
      setupNextMerge();
    }

    function setupNextMerge() {
      if (parent.length <= 1) {
        if (parent.length === 1 && parentNext.length === 0) {
          showResult(parent[0]); 
          return;
        }
        parent = parentNext.concat(parent);
        parentNext = [];
      }
      cmp1 = parent.shift();
      cmp2 = parent.shift();
      head1 = 0;
      head2 = 0;
      merged = [];
      showBattle();
    }

    function showBattle() {
      const left = cmp1[head1];
      const right = cmp2[head2];
      document.getElementById('battle-field').innerHTML = `
        <button class="character-btn" onclick="select(1)">
          <img src="${left.image}" alt="${left.name}" class="character-img">
          <span>${left.name}</span>
        </button>
        <button class="character-btn" onclick="select(2)">
          <img src="${right.image}" alt="${right.name}" class="character-img">
          <span>${right.name}</span>
        </button>
      `;
      currentBattle++;
      const progress = Math.min(99, (currentBattle / totalBattles) * 100);
      document.getElementById('progress-fill').style.width = progress + '%';
    }

    function select(winner) {
      if (winner === 1) { merged.push(cmp1[head1]); head1++; } 
      else { merged.push(cmp2[head2]); head2++; }

      if (head1 >= cmp1.length) {
        merged = merged.concat(cmp2.slice(head2));
        parentNext.push(merged);
        setupNextMerge();
      } else if (head2 >= cmp2.length) {
        merged = merged.concat(cmp1.slice(head1));
        parentNext.push(merged);
        setupNextMerge();
      } else {
        showBattle();
      }
    }

    function showResult(sortedList) {
      let html = '<h3 style="margin-bottom: 20px;">🎉 結果発表 🎉</h3>';
      html += '<div style="text-align: left; background: #1e1e1e; border-radius: 12px; padding: 15px;">';
      sortedList.forEach((member, index) => {
        html += `
          <div style="display: flex; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px;">
            <span style="font-size: 20px; font-weight: bold; width: 40px; color: #bb86fc;">${index + 1}</span>
            <img src="${member.image}" style="width: 40px; height: 40px; border-radius: 50%; margin-right: 15px; background: #444;">
            <span style="font-size: 16px;">${member.name}</span>
          </div>
        `;
      });
      html += '</div>';
      document.getElementById('battle-field').innerHTML = html;
      document.getElementById('progress-fill').style.width = '100%';
      document.getElementById('progress-fill').style.backgroundColor = '#03dac6';
    }

    initSort();
  </script>
